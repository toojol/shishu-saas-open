<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>市枢业务架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="584" fill="#ffffff"/>

  <!-- 第一层：三端 -->
  <rect x="24" y="16" width="912" height="108" rx="14" fill="#eef4ff" stroke="#bcd0f7"/>
  <text x="44" y="42" font-size="17" font-weight="700" fill="#1e3a8a">三端 · 同一份数据</text>
  <g filter="url(#shadow)">
    <rect x="44" y="54" width="272" height="60" rx="10" fill="#ffffff" stroke="#93b4f0"/>
    <rect x="344" y="54" width="272" height="60" rx="10" fill="#ffffff" stroke="#93b4f0"/>
    <rect x="644" y="54" width="272" height="60" rx="10" fill="#ffffff" stroke="#93b4f0"/>
  </g>
  <g text-anchor="middle">
    <text x="180" y="80" font-size="18" font-weight="700" fill="#0f172a">门里 · 后台管理</text>
    <text x="180" y="103" font-size="14" fill="#475569">商品 · 采购 · 库存 · 财务</text>
    <text x="480" y="80" font-size="18" font-weight="700" fill="#0f172a">落秤 · 收银端</text>
    <text x="480" y="103" font-size="14" fill="#475569">收银 · 称重 · 秤下发 · 打印</text>
    <text x="780" y="80" font-size="18" font-weight="700" fill="#0f172a">看板 · 手机端</text>
    <text x="780" y="103" font-size="14" fill="#475569">实收 · 毛利 · 预警 · 待办</text>
  </g>

  <!-- 层间箭头 -->
  <line x1="480" y1="128" x2="480" y2="152" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="496" y="145" font-size="14" fill="#475569">开单即同步</text>

  <!-- 第二层：云端业务模块 -->
  <rect x="24" y="156" width="912" height="262" rx="14" fill="#f6f8fb" stroke="#cfd8e6"/>
  <text x="44" y="182" font-size="17" font-weight="700" fill="#1e293b">市枢云 · 业务模块</text>

  <text x="44" y="208" font-size="14" font-weight="700" fill="#2563eb">进货与库存</text>
  <g filter="url(#shadow)">
    <rect x="44" y="216" width="272" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="344" y="216" width="272" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="644" y="216" width="272" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g text-anchor="middle">
    <text x="180" y="243" font-size="17" font-weight="700" fill="#0f172a">商品与价签</text>
    <text x="180" y="268" font-size="14" fill="#475569">一品多码 · 联营商品 · 价签</text>
    <text x="480" y="243" font-size="17" font-weight="700" fill="#0f172a">采购与库存</text>
    <text x="480" y="268" font-size="14" fill="#475569">批次效期 · 临期预警 · 补货</text>
    <text x="780" y="243" font-size="17" font-weight="700" fill="#0f172a">AI 识别录入</text>
    <text x="780" y="268" font-size="14" fill="#475569">包装建档 · 送货入库</text>
  </g>

  <text x="44" y="310" font-size="14" font-weight="700" fill="#2563eb">销售与财务</text>
  <g filter="url(#shadow)">
    <rect x="44" y="318" width="203" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="267" y="318" width="203" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="490" y="318" width="203" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="713" y="318" width="203" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g text-anchor="middle">
    <text x="145" y="345" font-size="17" font-weight="700" fill="#0f172a">收银与促销</text>
    <text x="145" y="370" font-size="14" fill="#475569">满减 · 满赠 · 积分</text>
    <text x="368" y="345" font-size="17" font-weight="700" fill="#0f172a">会员</text>
    <text x="368" y="370" font-size="14" fill="#475569">储值 · 积分 · 等级</text>
    <text x="591" y="345" font-size="17" font-weight="700" fill="#0f172a">联营与财务</text>
    <text x="591" y="370" font-size="14" fill="#475569">扣点 · 应付 · 对账</text>
    <text x="814" y="345" font-size="17" font-weight="700" fill="#0f172a">报表与看板</text>
    <text x="814" y="370" font-size="14" fill="#475569">实收 · 毛利 · 预警</text>
  </g>

  <!-- 层间箭头 -->
  <line x1="480" y1="422" x2="480" y2="446" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- 第三层：店内设备与外部服务 -->
  <rect x="24" y="450" width="912" height="118" rx="14" fill="#fff8ec" stroke="#f0d9a8"/>
  <text x="44" y="476" font-size="17" font-weight="700" fill="#7c4a03">店内设备与外部服务</text>
  <text x="212" y="476" font-size="14" fill="#92683a">落秤在店内局域网直接写入电子秤与打印机</text>
  <g filter="url(#shadow)">
    <rect x="44" y="488" width="203" height="64" rx="10" fill="#ffffff" stroke="#e8cf9c"/>
    <rect x="267" y="488" width="203" height="64" rx="10" fill="#ffffff" stroke="#e8cf9c"/>
    <rect x="490" y="488" width="203" height="64" rx="10" fill="#ffffff" stroke="#e8cf9c"/>
    <rect x="713" y="488" width="203" height="64" rx="10" fill="#ffffff" stroke="#e8cf9c"/>
  </g>
  <g text-anchor="middle">
    <text x="145" y="515" font-size="17" font-weight="700" fill="#0f172a">电子秤</text>
    <text x="145" y="538" font-size="14" fill="#475569">PLU 一键下传</text>
    <text x="368" y="515" font-size="17" font-weight="700" fill="#0f172a">小票 · 价签打印机</text>
    <text x="368" y="538" font-size="14" fill="#475569">本机打印</text>
    <text x="591" y="515" font-size="17" font-weight="700" fill="#0f172a">支付通道</text>
    <text x="591" y="538" font-size="14" fill="#475569">收款 · 对账单导入</text>
    <text x="814" y="515" font-size="17" font-weight="700" fill="#0f172a">识别与模型服务</text>
    <text x="814" y="538" font-size="14" fill="#475569">拍照识别 · 入库单</text>
  </g>
</svg>
